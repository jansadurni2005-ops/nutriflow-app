# FOCUS OS — variante para CUENTA GRATUITA (Personal Team)
# Genera el proyecto con:  xcodegen generate --spec project-free.yml
#
# Diferencias con project.yml:
#  - Sin extensiones de Screen Time (monitor, shield, shield action).
#  - Sin entitlements Family Controls ni Time Sensitive (no disponibles en cuentas gratuitas).
#  - Bloqueo y medición automática de apps NO disponibles: la app lo indica y usa registro manual.
#  - Si Xcode tampoco permite App Groups con tu equipo, borra la clave
#    com.apple.security.application-groups de FocusOS y FocusOSWidgets (el widget no mostrará datos).
#  - La app firmada con cuenta gratuita caduca a los 7 días: vuelve a ejecutarla desde Xcode.

name: FocusOS
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: es
  xcodeVersion: '16.0'
settings:
  base:
    BUNDLE_PREFIX: com.tunombre.focusos
    APP_GROUP_ID: group.com.tunombre.focusos
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  FocusOS:
    type: application
    platform: iOS
    sources:
    - path: FocusOS
    - path: Shared
    - path: SharedScreenTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    entitlements:
      path: FocusOS/FocusOS.entitlements
      properties:
        com.apple.security.application-groups:
        - $(APP_GROUP_ID)
    info:
      path: FocusOS/Info.plist
      properties:
        CFBundleDisplayName: FOCUS OS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UIBackgroundModes:
        - fetch
        - processing
        BGTaskSchedulerPermittedIdentifiers:
        - $(BUNDLE_PREFIX).refresh
        NSCalendarsFullAccessUsageDescription: FOCUS OS lee tus calendarios (incluido Google Calendar añadido en Ajustes de iOS) para que puedas importar eventos como bloques de trabajo. Nunca modifica
          tu calendario.
        NSCalendarsUsageDescription: FOCUS OS lee tus calendarios para importar eventos como bloques de trabajo. Nunca modifica tu calendario.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
    - target: FocusOSWidgets
    - sdk: FamilyControls.framework
    - sdk: DeviceActivity.framework
    - sdk: ManagedSettings.framework
  FocusOSWidgets:
    type: app-extension
    platform: iOS
    sources:
    - path: FocusOSWidgets
    - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).widgets
        SKIP_INSTALL: true
    entitlements:
      path: FocusOSWidgets/FocusOSWidgets.entitlements
      properties:
        com.apple.security.application-groups:
        - $(APP_GROUP_ID)
    info:
      path: FocusOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: FOCUS OS Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FocusOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: FocusOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
    - target: FocusOS
schemes:
  FocusOS:
    build:
      targets:
        FocusOS: all
        FocusOSTests:
        - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
      - FocusOSTests
    archive:
      config: Release
