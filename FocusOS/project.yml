# FOCUS OS — definición del proyecto para XcodeGen
# Genera FocusOS.xcodeproj con:  xcodegen generate
#
# ⚠️ Antes de generar, cambia BUNDLE_PREFIX, APP_GROUP_ID y DEVELOPMENT_TEAM
#    (ver README.md → "Instalación en tu iPhone").

name: FocusOS

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
  xcodeVersion: "16.0"

settings:
  base:
    BUNDLE_PREFIX: com.tunombre.focusos
    APP_GROUP_ID: group.com.tunombre.focusos
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  # ───────────────────────── App principal ─────────────────────────
  FocusOS:
    type: application
    platform: iOS
    sources:
      - path: FocusOS
      - path: Shared
      - path: SharedScreenTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    entitlements:
      path: FocusOS/FocusOS.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: FocusOS/Info.plist
      properties:
        CFBundleDisplayName: FOCUS OS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(BUNDLE_PREFIX).refresh
        NSCalendarsFullAccessUsageDescription: FOCUS OS lee tus calendarios (incluido Google Calendar añadido en Ajustes de iOS) para que puedas importar eventos como bloques de trabajo. Nunca modifica tu calendario.
        NSCalendarsUsageDescription: FOCUS OS lee tus calendarios para importar eventos como bloques de trabajo. Nunca modifica tu calendario.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: FocusOSWidgets
      - target: FocusOSMonitor
      - target: FocusOSShield
      - target: FocusOSShieldAction
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework

  # ─────────────────── Widgets + Live Activities ───────────────────
  FocusOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusOSWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).widgets
        SKIP_INSTALL: YES
    entitlements:
      path: FocusOSWidgets/FocusOSWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: FocusOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: FOCUS OS Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ───────────── Monitor de Screen Time (DeviceActivity) ─────────────
  FocusOSMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusOSMonitor
      - path: Shared/AppGroup.swift
      - path: Shared/ScreenTimeShared.swift
      - path: SharedScreenTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).monitor
        SKIP_INSTALL: YES
    entitlements:
      path: FocusOSMonitor/FocusOSMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: FocusOSMonitor/Info.plist
      properties:
        CFBundleDisplayName: FOCUS OS Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    dependencies:
      - sdk: DeviceActivity.framework
      - sdk: ManagedSettings.framework
      - sdk: FamilyControls.framework

  # ───────────── Pantalla de bloqueo personalizada (Shield) ─────────────
  FocusOSShield:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusOSShield
      - path: Shared/AppGroup.swift
      - path: Shared/ScreenTimeShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).shield
        SKIP_INSTALL: YES
    entitlements:
      path: FocusOSShield/FocusOSShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: FocusOSShield/Info.plist
      properties:
        CFBundleDisplayName: FOCUS OS Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    dependencies:
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework

  # ───────────── Acciones de los botones del Shield ─────────────
  FocusOSShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusOSShieldAction
      - path: Shared/AppGroup.swift
      - path: Shared/ScreenTimeShared.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).shieldaction
        SKIP_INSTALL: YES
    entitlements:
      path: FocusOSShieldAction/FocusOSShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: FocusOSShieldAction/Info.plist
      properties:
        CFBundleDisplayName: FOCUS OS Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    dependencies:
      - sdk: ManagedSettings.framework

  # ───────────────────────── Tests ─────────────────────────
  FocusOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FocusOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FocusOS

schemes:
  FocusOS:
    build:
      targets:
        FocusOS: all
        FocusOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FocusOSTests
    archive:
      config: Release
