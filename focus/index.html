<style>
:root{
  --bg:#090909; --card:#171717; --card2:#202020; --stroke:rgba(255,255,255,.07);
  --accent:#FF6500; --accent-soft:rgba(255,101,0,.16);
  --fg:#FFFFFF; --fg2:#A1A1A1; --fg3:#5E5E5E;
  --ok:#35D07F; --warn:#FFB020; --bad:#FF3B30; --info:#4C8DFF;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --wide:"Archivo","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.over{font-family:var(--wide);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2)}
.over.acc{color:var(--accent)}
.h1{font-family:var(--wide);font-weight:800;font-size:28px;margin:4px 0 0;line-height:1.05}
.num{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 2px 4px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:24px;padding:18px}
.card.hl{border-color:rgba(255,101,0,.45)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card2);border-radius:18px;padding:13px;min-width:0}
.tile .v{font-family:var(--num);font-weight:700;font-size:26px;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .f{font-size:10.5px;color:var(--fg3);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(161,161,161,.12);color:var(--fg2);white-space:nowrap}
.chip.ok{background:rgba(53,208,127,.14);color:var(--ok)} .chip.warn{background:rgba(255,176,32,.14);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.round.acc{background:var(--accent);color:#000}
.btn{display:block;width:100%;padding:15px;border-radius:18px;font-weight:700;font-size:15.5px;background:var(--accent);color:#000;transition:transform .15s;text-align:center}
.btn:active,.btn2:active{transform:scale(.97)}
.btn2{display:block;width:100%;padding:13px;border-radius:16px;font-weight:600;font-size:14.5px;background:var(--card2);border:1px solid var(--stroke);text-align:center;transition:transform .15s}
.btn2.acc{color:var(--accent)} .btn2.bad{color:var(--bad)}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--fg2)}
.ctrl i{width:54px;height:54px;border-radius:50%;background:var(--card2);border:1px solid var(--stroke);display:grid;place-items:center;font-style:normal;font-size:18px;color:var(--fg)}
.ctrl.fill i{background:var(--accent);color:#000;border:0}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(255,101,0,.7),var(--accent));transition:width .6s}
.ring{position:relative;margin:6px auto;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.blk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--stroke);border-radius:18px;padding:13px;width:100%;text-align:left;min-width:0}
.blk .stripe{width:4px;height:40px;border-radius:3px;flex:none}
.blk .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{font-size:12px;color:var(--fg2)}
.muted{color:var(--fg2);font-size:13.5px;line-height:1.45;margin:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(9,9,9,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--stroke);padding:9px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--wide);font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--fg3)}
.tab .ic{width:50px;height:30px;border-radius:99px;display:grid;place-items:center;font-size:16px;transition:background .25s}
.tab.on{color:var(--fg)} .tab.on .ic{background:var(--accent-soft);color:var(--accent)}
.mini{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:4;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.mini button{max-width:408px;margin:0 auto;display:flex;width:100%;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:var(--card2);border:1px solid rgba(255,101,0,.35);text-align:left}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.weekstrip button{padding:8px 0;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:3px}
.weekstrip button.on{background:var(--accent);color:#000}
.weekstrip button.today .d{color:var(--accent)} .weekstrip button.on .d{color:#000}
.timeline{position:relative}
.hour{display:flex;gap:8px;height:96px;border-top:1px solid var(--stroke);font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.hour span{width:40px;text-align:right;transform:translateY(-7px)}
.tl-blk{position:absolute;border-radius:8px;overflow:hidden;border-left:3px solid;display:flex;box-sizing:border-box}
.tl-blk.compact .body{padding:1px 6px;justify-content:center}
.tl-blk.compact .t{font-size:11.5px}
.tl-blk.compact .rs{height:7px;padding-bottom:1px}
.tl-blk.compact .rs:after{height:2px}
.tl-blk.narrow .grip{width:22px}
.tl-blk .body{flex:1;min-width:0;padding:5px 8px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.tl-blk .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tl-blk .s{font-size:11px;color:var(--fg2)}
.tl-blk .grip{width:34px;display:grid;place-items:center;color:var(--fg2);touch-action:none;cursor:grab;font-size:14px}
.tl-blk .rs{position:absolute;left:0;right:34px;bottom:0;height:12px;touch-action:none;cursor:ns-resize;display:flex;justify-content:center;align-items:flex-end;padding-bottom:3px}
.tl-blk .rs:after{content:"";width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.tl-blk.drag{box-shadow:0 0 0 2px var(--accent),0 10px 24px rgba(0,0,0,.5);z-index:3}
.now{position:absolute;left:52px;right:0;height:1px;background:var(--accent);opacity:.85;pointer-events:none;z-index:4}
.now .lbl{position:absolute;left:-50px;top:-7px;color:var(--accent);font-family:var(--num);font-weight:700;font-size:11px;line-height:14px;width:42px;text-align:right;background:var(--bg);font-variant-numeric:tabular-nums}
.now:after{content:"";position:absolute;left:-3px;top:-2.5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.past{position:absolute;left:52px;right:0;top:0;background:rgba(9,9,9,.25);pointer-events:none;z-index:3;border-radius:0 0 4px 4px}
.nowcard{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:6;background:rgba(23,23,23,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,101,0,.4);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:440px;background:var(--bg);border-radius:26px 26px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--stroke);max-height:90%;overflow:auto}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg2)}
input,select{background:var(--card2);border:1px solid var(--stroke);border-radius:12px;padding:12px;color:var(--fg);font:inherit;font-size:16px;width:100%;min-width:0}
input[type=range]{padding:0;accent-color:var(--accent);border:0;background:none}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:12px;padding:3px}
.seg button{padding:8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--card2);color:var(--fg)}
.deep{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.deep .inner{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;flex:1;position:relative}
.halo{position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,101,0,.18),transparent 60%);top:40px;left:50%;transform:translateX(-50%);pointer-events:none;animation:br 8s ease-in-out infinite}
@keyframes br{50%{transform:translateX(-50%) scale(1.1)}}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat>*{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .pair i{width:40%;border-radius:5px 5px 2px 2px;display:block;min-height:2px}
.ach{display:flex;gap:12px;align-items:center}
.ach .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--fg3);flex:none;font-size:16px}
.ach.on .ic{background:var(--accent);color:#000}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1d1d1d;border:1px solid var(--stroke);border-radius:16px;padding:12px 16px;font-size:13.5px;z-index:30;width:max-content;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app" id="app"></div>
<div id="mini"></div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>
<div id="toast"></div>

<script>
'use strict';
/* ───────────────────────── Utilidades ───────────────────────── */
const KEY='focusos-v1';
const KINDS={deep:'Trabajo profundo',work:'Trabajo',meeting:'Reunión / llamada',rest:'Descanso'};
const COLORS=['FF6500','FF9F0A','FFD60A','35D07F','30D5C8','4C8DFF','7D5CFF','BF5AF2','FF375F','8E8E93'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const clock=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const dur=s=>{const m=Math.round(Math.max(0,s)/60),h=Math.floor(m/60),r=m%60;return h&&r?`${h}h ${r}m`:h?`${h}h`:`${r}m`};
const hrs=s=>(s/3600).toLocaleString('es-ES',{maximumFractionDigits:1})+' h';
const pct=v=>v==null?'—':Math.round(v*100)+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const keyToDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const atMin=(k,min)=>keyToDate(k).getTime()+min*60e3;
const minOf=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};
const addDays=(k,n)=>{const d=keyToDate(k);d.setDate(d.getDate()+n);return dayKey(d)};
const uid=()=>Math.random().toString(36).slice(2,10);
const vibrate=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ───────────────────────── Datos ─────────────────────────
   Todo se guarda en este dispositivo (localStorage). Nada se inventa:
   las estadísticas salen únicamente de lo que registras. */
const DEFAULT_TEMPLATE=[
  ['Planificación diaria','06:30','07:00','work','8E8E93','Definir las 3 prioridades del día'],
  ['Trabajo profundo','07:00','09:00','deep','FF6500','Avanzar en el proyecto principal'],
  ['Responder mensajes','09:00','09:30','work','4C8DFF','Bandeja de entrada a cero'],
  ['Revisiones de clientes','09:30','11:00','work','35D07F','Revisar progresos y ajustar planes'],
  ['Descanso','11:00','11:15','rest','30D5C8',''],
  ['Creación de contenido','11:15','12:30','work','BF5AF2','Publicar y responder comentarios'],
  ['Gestión del negocio','12:30','13:00','work','FFD60A','Finanzas y operaciones']
].map(([title,s,e,kind,color,obj])=>({id:uid(),title,start:s,end:e,kind,color,obj,days:[1,2,3,4,5]}));

let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.days)S={template:null,days:{},session:null,weights:{c:40,a:25,t:25,p:10},goals:{weekHours:35,target:90,deepBlocks:4,maxDistraction:30},onboarded:false};
S=normalizeState(S);
const save=(touch=true)=>{if(touch)S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este dispositivo.')}if(touch)scheduleCloud()};
const t2m=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

function ensureDay(k){
  if(S.days[k])return S.days[k];
  const today=dayKey(Date.now());
  const day={blocks:[],sessions:[]};
  if(k>=today&&S.template){
    const wd=keyToDate(k).getDay();
    S.template.filter(t=>t.days.includes(wd)).forEach(t=>day.blocks.push(newBlock(k,t)));
    day.blocks.sort((a,b)=>a.start-b.start);
  }
  if(k>=today){S.days[k]=day;syncTasks(k)}
  return day;
}
/* Tareas diarias: plantillas que se repiten (S.taskTpl) + tareas sueltas de cada día (day.tasks). */
function syncTasks(k){
  const d=S.days[k];if(!d||k<dayKey(Date.now()))return;d.tasks=d.tasks||[];
  const wd=keyToDate(k).getDay();
  for(const t of S.taskTpl||[])if(t.days.includes(wd)&&!d.tasks.some(x=>x.tplId===t.id)&&!(d.skipTpl||[]).includes(t.id))d.tasks.push({id:uid(),tplId:t.id,title:t.title,time:t.time||'',done:false,doneAt:null});
  sortTasks(d);
}
function sortTasks(d){d.tasks.sort((a,b)=>(a.done-b.done)||((b.top?1:0)-(a.top?1:0))||((a.topOrder??9)-(b.topOrder??9))||((a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0))}
const dayTasks=k=>(S.days[k]&&S.days[k].tasks)||[];
function newBlock(k,t){return {id:uid(),tplId:t.id||null,title:t.title,kind:t.kind,color:t.color,obj:t.obj||'',start:atMin(k,t2m(t.start)),end:atMin(k,t2m(t.end)),status:'pending',actualStart:null,actualEnd:null,worked:0,distraction:0,paused:0}}
function markMissed(){
  const n=Date.now();
  for(const k in S.days)for(const b of S.days[k].blocks){
    if(b.status==='pending'&&dayKey(b.start)<dayKey(n)&&!(S.session&&S.session.blockId===b.id))b.status=b.kind==='rest'?'completed':(b.worked>=(b.end-b.start)/2e3?'completed':'missed');
  }
}
const findBlock=id=>{for(const k in S.days){const b=S.days[k].blocks.find(x=>x.id===id);if(b)return [b,k]}return [null,null]};

/* ───────────────────────── Sesión (marcas temporales) ───────────────────────── */
const sess=()=>S.session;
const sPaused=(s,n=Date.now())=>s.paused+(s.pauseAt?(n-s.pauseAt)/1e3:0);
const sRest=(s,n=Date.now())=>s.rest+(s.restAt?(n-s.restAt)/1e3:0);
const sFocused=(s,n=Date.now())=>Math.max(0,(n-s.startedAt)/1e3-sPaused(s,n)-sRest(s,n)-s.distraction);
function sConc(s,n=Date.now()){const f=sFocused(s,n),d=f+s.distraction+sPaused(s,n);return d<60?null:f/d}

function startBlock(id){
  const [b]=findBlock(id);if(!b)return;
  if(S.session){if(S.session.blockId===id){deep=true;render();return}finish('switched',true)}
  const n=Date.now(),outside=n<b.start-5*60e3||n>=b.end,len=b.end-b.start;if(outside&&!b.actualStart)b.flex=true;if(!b.actualStart)b.actualStart=n;b.status='inprogress';
  S.session={blockId:id,day:dayKey(b.start),title:b.title,obj:b.obj,kind:b.kind,startedAt:n,plannedEnd:outside?n+Math.max(len,5*60e3):Math.max(b.end,n+15*60e3),paused:0,pauseAt:null,rest:0,restAt:null,distraction:0,notified:{}};
  save();vibrate(20);unlockAudio();chime();const late=(n-b.start)/1e3;
  toast(outside?`Bloque cambiado de hora: ${dur(len/1e3)} desde ahora`:late>60?`Bloque iniciado · retraso registrado: ${dur(late)}`:'Bloque iniciado');deep=true;requestWake();render();
}
function markBlockDone(id,minutes){
  const [b]=findBlock(id);if(!b)return;const n=Date.now(),sec=Math.max(0,minutes*60);
  if(S.session&&S.session.blockId===id){finish('completed');return}
  b.worked=Math.max(b.worked,sec);b.status='completed';b.flex=true;b.manual=true;
  if(!b.actualStart)b.actualStart=n-sec*1e3;b.actualEnd=n;save();vibrate([20,60,20]);chime();
  const left=pendingBlocks(dayKey(b.start)).length;
  toast(`✓ «${b.title}» hecho${left?` · te falta${left>1?'n':''} ${left} bloque${left>1?'s':''}`:' · ¡todos los bloques de hoy hechos! 🔥'}`);
}
/* Bloques de trabajo de un día que aún no has hecho (da igual su hora). */
function pendingBlocks(k){const s=sess();return ensureDay(k).blocks.filter(b=>b.kind!=='rest'&&(b.status==='pending'||b.status==='missed')&&!(s&&s.blockId===b.id))}
function startFree(title,obj,min,kind){
  if(S.session)finish('switched',true);
  const n=Date.now();
  S.session={blockId:null,day:dayKey(n),title:title||'Sesión de concentración',obj,kind,startedAt:n,plannedEnd:n+min*60e3,paused:0,pauseAt:null,rest:0,restAt:null,distraction:0,notified:{}};
  save();vibrate(20);unlockAudio();chime();deep=true;requestWake();render();
}

/* ───────────────────────── Motor de efectividad ─────────────────────────
   Igual que en la app de iPhone: 40 % concentración, 25 % cumplimiento,
   25 % tareas completadas, 10 % puntualidad (editable). Sin datos → sin puntuación. */
function score(k,n=Date.now()){
  const day=S.days[k]||{blocks:[],sessions:[]};
  const end=keyToDate(k).getTime()+86400e3;n=Math.min(n,end);
  const w=S.weights;let planned=0,pe=0,adh=0,eff=0,cf=0,cd=0,cp=0,due=0,done=0,deepDone=0,deepSec=0,clean=0,ontime=0;const punct=[];
  const s=sess();
  for(const b of day.blocks){
    if(b.kind==='rest')continue;
    let worked=b.worked,dis=b.distraction,pau=b.paused;
    if(s&&s.blockId===b.id){worked+=sFocused(s,n);dis+=s.distraction;pau+=sPaused(s,n)}
    if(b.kind==='meeting'&&b.status==='completed'&&!worked)worked=(b.end-b.start)/1e3;
    const p=(b.end-b.start)/1e3;planned+=p;eff+=worked;if(b.kind==='deep')deepSec+=worked;
    const ev=(b.status==='completed'||b.status==='missed'||b.end<=n)?p:(b.start<n?(n-b.start)/1e3:0);
    if(ev>0){pe+=ev;adh+=Math.min(worked,ev)}
    if(b.kind!=='meeting'&&(worked>0||dis>0)){cf+=worked;cd+=dis;cp+=pau}
    if(b.status==='completed'||b.status==='missed'||b.end<=n){due++;if(b.status==='completed'){done++;if(b.kind==='deep')deepDone++;if(b.actualStart&&dis===0&&b.kind!=='meeting')clean++}}
    if(b.actualStart&&!b.flex){const d=(b.actualStart-b.start)/1e3;if(d<=120)ontime++;punct.push(d<=120?1:d>=1800?0:1-(d-120)/1680)}
  }
  // Tareas del día: cuentan al marcarlas o cuando vence su hora (o al terminar el día si no tienen hora).
  let tDue=0,tDone=0;const dayEnd=keyToDate(k).getTime()+86400e3;
  for(const t of day.tasks||[]){const dueAt=t.time?atMin(k,t2m(t.time)):dayEnd;if(t.done||n>=dueAt){due++;tDue++;if(t.done){done++;tDone++}}}
  const free=[...day.sessions];if(s&&!s.blockId&&s.day===k)free.push({focused:sFocused(s,n),distraction:s.distraction,paused:sPaused(s,n),kind:s.kind});
  for(const x of free){eff+=x.focused;cf+=x.focused;cd+=x.distraction;cp+=x.paused;if(x.kind==='deep')deepSec+=x.focused}
  const comps=[
    {k:'Concentración',w:w.c,v:cf+cd+cp>=300?cf/(cf+cd+cp):null,d:cf+cd+cp>=300?`${dur(cf)} concentrado · ${dur(cd)} distracciones · ${dur(cp)} pausas`:'Sin sesiones registradas'},
    {k:'Cumplimiento del horario',w:w.a,v:pe>=300?Math.min(1,adh/pe):null,d:pe>=300?`${dur(adh)} de ${dur(pe)} planificado hasta ahora`:'Aún no ha pasado tiempo planificado'},
    {k:'Tareas completadas',w:w.t,v:due?done/due:null,d:due?`${done} de ${due} completados (bloques vencidos y tareas del día${tDue?`: ${tDone}/${tDue} tareas`:''})`:'Ningún bloque ni tarea ha vencido todavía'},
    {k:'Puntualidad',w:w.p,v:punct.length?punct.reduce((a,b)=>a+b,0)/punct.length:null,d:punct.length?`${punct.length} bloques iniciados`:'Ningún bloque iniciado'}];
  const av=comps.filter(c=>c.v!=null&&c.w>0);const ws=av.reduce((a,c)=>a+c.w,0);
  const sc=ws?av.reduce((a,c)=>a+c.v*c.w,0)/ws:null;
  const conf=sc==null?'Sin datos suficientes':(av.length<comps.filter(c=>c.w>0).length||pe+cf+cd+cp<1800?'Estimada':'Datos completos');
  const all=day.blocks;let prog=0,remaining=0;
  if(all.length){const f=all[0].start,l=Math.max(...all.map(b=>b.end));prog=Math.min(1,Math.max(0,(n-f)/(l-f)));remaining=Math.max(0,(l-n)/1e3)}
  const work=all.filter(b=>b.kind!=='rest');
  return {sc,conf,comps,eff,planned,dis:cd,remaining,prog,done:work.filter(b=>b.status==='completed').length,total:work.length,deepDone,deepSec,clean,ontime,tasksTotal:(day.tasks||[]).length,tasksDone:(day.tasks||[]).filter(t=>t.done).length,hasData:work.length>0||free.length>0||(day.tasks||[]).length>0};
}

function history(days){const out=[];const today=dayKey(Date.now());for(let i=days-1;i>=0;i--){const k=addDays(today,-i);out.push([k,score(k)])}return out}
function streaks(){
  const h=history(120),t=S.goals.target/100;let best=0,run=0;
  for(const [,r] of h){if(!r.hasData)continue;if(r.sc!=null&&r.sc>=t){run++;best=Math.max(best,run)}else run=0}
  let cur=0;for(let i=h.length-1;i>=0;i--){const r=h[i][1];if(!r.hasData)continue;if(r.sc!=null&&r.sc>=t)cur++;else if(i===h.length-1)continue;else break}
  return {cur,best:Math.max(best,cur),h};
}

/* Reparte en columnas los bloques que coinciden en el tiempo (solo los que se solapan de verdad). */
function columnLayout(blocks){
  const sorted=blocks.slice().sort((a,b)=>a.start-b.start||a.end-b.end);const out={};let group=[],cols=[],gEnd=-Infinity;
  const flush=()=>{group.forEach(b=>out[b.id].n=Math.max(1,cols.length));group=[];cols=[]};
  for(const b of sorted){if(b.start>=gEnd)flush();let i=cols.findIndex(e=>e<=b.start);if(i<0){i=cols.length;cols.push(b.end)}else cols[i]=b.end;out[b.id]={col:i,n:1};group.push(b);gEnd=Math.max(gEnd,b.end)}
  flush();return out;
}
function overlapCount(blocks){const L=columnLayout(blocks);return Object.values(L).filter(x=>x.n>1).length}
/* Empuja hacia abajo los bloques pendientes que se solapan, manteniendo su duración. */
function fixOverlaps(k){
  const d=S.days[k];if(!d)return 0;d.blocks.sort((a,b)=>a.start-b.start||a.end-b.end);let moved=0,prevEnd=-Infinity;
  for(const b of d.blocks){if(b.start<prevEnd&&b.status==='pending'&&!b.actualStart){const len=b.end-b.start;b.start=prevEnd;b.end=prevEnd+len;moved++}prevEnd=Math.max(prevEnd,b.end)}
  save();return moved;
}
/* Recoloca el día para que nada se solape. El bloque que acabas de mover o editar
   se queda donde lo pones: los anteriores que lo pisan se acortan hasta su inicio
   (o pasan detrás si quedarían en menos de 5 min) y los siguientes se empujan en cadena.
   Los bloques ya empezados o completados no se tocan. */
function settle(k,pinId){
  const d=S.days[k];if(!d)return 0;const pin=d.blocks.find(b=>b.id===pinId);if(!pin)return 0;
  const movable=b=>b.id!==pin.id&&b.status==='pending'&&!b.actualStart&&!(S.session&&S.session.blockId===b.id);
  let changed=0;const after=[];
  for(const b of d.blocks){
    if(!movable(b))continue;
    if(b.start<pin.start&&b.end>pin.start){
      if(pin.start-b.start>=5*60e3){b.end=pin.start;changed++}else after.push(b);
    }else if(b.start>=pin.start)after.push(b);
  }
  after.sort((a,b)=>a.start-b.start);
  let prevEnd=pin.end;
  for(const b of after){if(b.start<prevEnd){const len=b.end-b.start;b.start=prevEnd;b.end=prevEnd+len;changed++}prevEnd=Math.max(prevEnd,b.end)}
  d.blocks.sort((a,b)=>a.start-b.start||a.end-b.end);save();return changed;
}

    const tips=[];const delays=day.blocks.filter(b=>b.actualStart).map(b=>Math.max(0,(b.actualStart-b.start)/1e3));if(delays.length){const a=delays.reduce((x,y)=>x+y,0)/delays.length;tips.push(a>300?`Empezaste con ${dur(a)} de retraso medio. Deja preparado el primer bloque la noche anterior.`:`Puntualidad sólida: retraso medio de ${dur(a)}.`)}

  return `<div class="modal" data-act="close"><div class="sheet stack" data-sheet>${body}<button style="color:var(--fg3);font-size:14px;padding:6px" data-act="close">Cerrar</button></div></div>`;
}

/* ───────────────────────── Acciones ───────────────────────── */
function readEditor(){
  const t=$('#e-t').value.trim(),s=$('#e-s').value,e=$('#e-e').value,err=$('#e-err');
  if(!t){err.textContent='Escribe un nombre para la tarea.';err.hidden=false;return null}
  if(!s||!e||t2m(e)<=t2m(s)){err.textContent='La hora de fin debe ser posterior al inicio.';err.hidden=false;return null}
  const color=$('#e-c [data-sel]')?.dataset.color||overlay.color;
  return {title:t,obj:$('#e-o').value.trim(),kind:$('#e-k').value,start:s,end:e,color};
}
function saveBlock(){
  const v=readEditor();if(!v)return;const k=schedDay;
  let [b,bk]=overlay.id?findBlock(overlay.id):[null,null];bk=bk||k;
  if(!b){b={id:uid(),tplId:null,status:'pending',actualStart:null,actualEnd:null,worked:0,distraction:0,paused:0};ensureDay(k).blocks.push(b)}
  Object.assign(b,{title:v.title,obj:v.obj,kind:v.kind,color:v.color||b.color||'FF6500',start:atMin(bk,t2m(v.start)),end:atMin(bk,t2m(v.end))});
  const st=$('#e-st');if(st)b.status=st.value;const wv=$('#e-w');if(wv&&wv.value!=='')b.worked=Math.max(0,+wv.value)*60;
  S.days[bk].blocks.sort((a,c)=>a.start-c.start);const moved=settle(bk,b.id);overlay=null;
  toast(moved?`Guardado · ${moved} bloque${moved>1?'s':''} recolocado${moved>1?'s':''} para que no se solapen`:'Bloque guardado');render();
}
function saveTpl(){
  const v=readEditor();if(!v)return;const days=[...document.querySelectorAll('#e-d .on')].map(x=>+x.dataset.wd);
  if(!days.length){const err=$('#e-err');err.textContent='Elige al menos un día.';err.hidden=false;return}
  S.template=S.template||[];let t=S.template.find(x=>x.id===overlay.id);
  if(!t){t={id:uid()};S.template.push(t)}
  Object.assign(t,v,{color:v.color||t.color||'FF6500',days});
  // Aplicar a hoy y mañana si el bloque aún no ha empezado.
  [dayKey(Date.now()),addDays(dayKey(Date.now()),1)].forEach(k=>{const d=S.days[k];if(!d)return;
    d.blocks=d.blocks.filter(b=>!(b.tplId===t.id&&b.status==='pending'&&!b.actualStart&&b.start>Date.now()));
    if(days.includes(keyToDate(k).getDay())&&!d.blocks.some(b=>b.tplId===t.id)){const nb=newBlock(k,t);if(nb.start>Date.now())d.blocks.push(nb)}
    d.blocks.sort((a,c)=>a.start-c.start)});
  save();overlay=null;toast('Rutina guardada');render();
}
function copyDay(from,to){
  const src=ensureDay(from),dst=ensureDay(to)||(S.days[to]={blocks:[],sessions:[]});if(!S.days[to])S.days[to]=dst;let n=0;
  for(const b of src.blocks){const s=atMin(to,minOf(b.start));if(dst.blocks.some(x=>x.title===b.title&&Math.abs(x.start-s)<60e3))continue;
    dst.blocks.push({...b,id:uid(),start:s,end:s+(b.end-b.start),status:'pending',actualStart:null,actualEnd:null,worked:0,distraction:0,paused:0});n++}
  dst.blocks.sort((a,c)=>a.start-c.start);save();return n;
}
function moveTomorrow(id){
  const [b,k]=findBlock(id);if(!b)return;const nk=addDays(k,1);const d=ensureDay(nk)||(S.days[nk]={blocks:[],sessions:[]});if(!S.days[nk])S.days[nk]=d;
  d.blocks.push({...b,id:uid(),tplId:null,start:b.start+86400e3,end:b.end+86400e3,status:'pending',actualStart:null,actualEnd:null,worked:0,distraction:0,paused:0});
  d.blocks.sort((a,c)=>a.start-c.start);if(b.status!=='completed')b.status='missed';save();toast('Tarea movida a mañana');
}
function toggleTask(id,k){
  k=k||dayKey(Date.now());const d=S.days[k],t=d&&(d.tasks||[]).find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():null;sortTasks(d);save();
  if(t.done){vibrate(15);const all=d.tasks.every(x=>x.done);if(all&&k===dayKey(Date.now())){chime();toast('🔥 ¡Todas las tareas de hoy completadas!')}else toast(`Hecho: ${t.title}`)}
}
function saveTask(){
  const title=$('#tk-t').value.trim(),time=$('#tk-h').value,repeat=$('#tk-mode .on')?.dataset.tmode==='repeat';
  const days=repeat?[...document.querySelectorAll('#tk-d .on')].map(x=>+x.dataset.wd):[];
  const err=m=>{const e=$('#tk-err');e.textContent=m;e.hidden=false};
  if(!title)return err('Escribe la tarea.');
  if(repeat&&!days.length)return err('Elige al menos un día de la semana.');
  const today=dayKey(Date.now()),oldK=overlay.k||today;
  let targetK=repeat?(oldK<today?today:oldK):($('#tk-date').value||today);if(targetK<today)targetK=today;
  const od=S.days[oldK];let t=overlay.id&&od?(od.tasks||[]).find(x=>x.id===overlay.id):null;
  // Cambio de día: sacar la tarea del día anterior.
  if(t&&targetK!==oldK&&!repeat){od.tasks=od.tasks.filter(x=>x.id!==t.id);if(t.tplId)(od.skipTpl=od.skipTpl||[]).push(t.tplId)}
  const d=ensureDay(targetK);d.tasks=d.tasks||[];
  if(!t||(targetK!==oldK&&!repeat)){const prev=t;t={id:uid(),tplId:null,done:false,doneAt:null};if(prev&&!prev.tplId)Object.assign(t,{done:prev.done,doneAt:prev.doneAt});d.tasks.push(t)}
  t.title=title;t.time=time;const bsel=$('#tk-b');t.blockId=bsel&&!repeat&&targetK===oldK?(bsel.value||null):(bsel&&!repeat&&bsel.value&&ensureDay(targetK).blocks.some(b=>b.id===bsel.value)?bsel.value:null);
  if(overlay.fromInbox){const ii=S.inbox.findIndex(x=>x.id===overlay.fromInbox);if(ii>=0)S.inbox.splice(ii,1)}
  S.taskTpl=S.taskTpl||[];
  if(repeat){let tpl=t.tplId&&S.taskTpl.find(x=>x.id===t.tplId);if(!tpl){tpl={id:uid()};S.taskTpl.push(tpl);t.tplId=tpl.id}
    Object.assign(tpl,{title,time,days});
    for(const dk in S.days)if(dk>targetK&&S.days[dk].tasks)S.days[dk].tasks.forEach(x=>{if(x.tplId===tpl.id&&!x.done){x.title=title;x.time=time}});
    for(let i=0;i<=1;i++)syncTasks(addDays(today,i));
  }else if(t.tplId){const old=t.tplId;S.taskTpl=S.taskTpl.filter(x=>x.id!==old);for(const dk in S.days)if(dk>targetK&&S.days[dk].tasks)S.days[dk].tasks=S.days[dk].tasks.filter(x=>x.tplId!==old||x.done);t.tplId=null}
  sortTasks(d);save();overlay=null;
  toast(repeat?'Tarea guardada: se repetirá sola':`Tarea guardada para ${dayLabel(targetK)}`);render();
}
function moveTaskTomorrow(id,k){
  k=k||dayKey(Date.now());const d=S.days[k],t=d&&(d.tasks||[]).find(x=>x.id===id);if(!t)return;
  const today=dayKey(Date.now()),nk=k<today?today:addDays(k,1),nd=ensureDay(nk);nd.tasks=nd.tasks||[];
  if(!t.tplId)nd.tasks.push({...t,id:uid(),done:false,doneAt:null});
  d.tasks=d.tasks.filter(x=>x.id!==id);if(t.tplId)(d.skipTpl=d.skipTpl||[]).push(t.tplId);
  sortTasks(nd);save();toast(t.tplId?'Quitada de este día (se repite igualmente)':`Tarea pasada a ${dayLabel(nk)}`);
}
function exportCSV(){
  const rows=['fecha;tarea;tipo;inicio;fin;estado;inicio_real;retraso_min;min_trabajados;min_distraccion;efectividad_dia_%'];
  Object.keys(S.days).sort().forEach(k=>{const r=score(k);S.days[k].blocks.forEach(b=>rows.push([k,'"'+b.title.replace(/"/g,'""')+'"',KINDS[b.kind],hhmm(b.start),hhmm(b.end),b.status,b.actualStart?hhmm(b.actualStart):'',b.actualStart?Math.round(Math.max(0,b.actualStart-b.start)/60e3):'',Math.round(b.worked/60),Math.round(b.distraction/60),r.sc==null?'':Math.round(r.sc*100)].join(';')))});
  const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`focusos_${dayKey(Date.now())}.csv`;document.body.appendChild(a);a.click();a.remove();
}

/* ───────────────────────── Avisos (mientras la app está abierta) ───────────────────────── */
async function notify(title,body){
  vibrate([200,100,200]);
  if(S.pushOn){toast(title+(body?' · '+body:''));return}
  if(!('Notification' in window)||Notification.permission!=='granted'){toast(title+' · '+body);return}
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:title});else new Notification(title,{body,icon:'icon-192.png'})}catch(e){toast(title)}

/* ───────────────────────── Alarmas sonoras ─────────────────────────
   Sonido generado con Web Audio (no necesita archivos). iOS solo permite sonar
   después de que toques la pantalla una vez y mientras la app está abierta. */
const SOUNDS={pulse:'Pulse',chime:'Chime',rise:'Rise',bell:'Campana'};
let AC=null,alarmTimer=null,alarmStop=0;
function audio(){try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback'}catch(e){}
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state!=='running')AC.resume().catch(()=>{});return AC}
function unlockAudio(){const a=audio();if(!a)return;const b=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(0)}
function tone(a,t,freq,len,vol){const o=a.createOscillator(),g=a.createGain(),o2=a.createOscillator(),g2=a.createGain();
  o.type='sine';o.frequency.value=freq;o2.type='triangle';o2.frequency.value=freq*2;g2.gain.value=.25;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(a.destination);o.start(t);o2.start(t);o.stop(t+len+.05);o2.stop(t+len+.05)}
function pattern(name,t0,vol){const a=audio();if(!a)return 1;const t=Math.max(t0,a.currentTime+.02);
  const P={pulse:[[880,0,.15],[880,.22,.15],[880,.55,.15],[880,.77,.15]],chime:[[1318.5,0,.45],[987.8,.38,.45],[659.3,.76,.8]],
    rise:[[523.3,0,.13],[659.3,.14,.13],[784,.28,.13],[1046.5,.42,.4]],bell:[[1046.5,0,1.1],[1568,0,1.1],[1046.5,.6,1.1],[1568,.6,1.1]]}[name]||[];
  P.forEach(([f,d,l])=>tone(a,t+d,f,l,vol));return 1.6}
/* Suena una vez (aviso corto) */
function chime(){if(!S.alarm.enabled)return;pattern(S.alarm.sound,0,S.alarm.volume/100*.6)}
/* Alarma que se repite hasta pararla (máx. 60 s) */
function startAlarm(){if(!S.alarm.enabled)return;stopAlarm();const a=audio();if(!a)return;alarmStop=Date.now()+60e3;
  const loop=()=>{if(Date.now()>alarmStop){stopAlarm();return}pattern(S.alarm.sound,0,S.alarm.volume/100);vibrate([300,150,300]);alarmTimer=setTimeout(loop,1700)};loop()}
function stopAlarm(){clearTimeout(alarmTimer);alarmTimer=null}
document.addEventListener('pointerdown',e=>{unlockAudio();if(overlay&&overlay.type==='alarm'&&!alarmTimer&&!e.target.closest('[data-act^=alarm]'))startAlarm()},{capture:true,once:false,passive:true});

const fired=new Set();
function checkAlerts(){
  const n=Date.now(),k=dayKey(n),day=S.days[k];if(!day)return;
  for(const b of day.blocks){
    const pre=b.start-5*60e3;
    if(b.kind!=='rest'&&n>=pre&&n<pre+60e3&&!fired.has(b.id+'pre')){fired.add(b.id+'pre');notify(`En 5 min: ${b.title}`,b.obj?`Objetivo: ${b.obj}`:KINDS[b.kind])}
    if(n>=b.start&&n<b.start+60e3&&!fired.has(b.id+'st')){fired.add(b.id+'st');if(S.alarm.onStart&&!sess())chime();notify(b.kind==='rest'?'Descanso':`Empieza: ${b.title}`,b.kind==='rest'?`Vuelves a las ${hhmm(b.end)}`:`Hasta las ${hhmm(b.end)}`)}
    if(b.kind!=='rest'&&!b.actualStart&&n>=b.start+5*60e3&&n<b.start+6*60e3&&!fired.has(b.id+'ns')){fired.add(b.id+'ns');notify(`Aún no has empezado «${b.title}»`,'El retraso se está registrando.')}
    if(n>=b.end&&n<b.end+60e3&&!fired.has(b.id+'end')){fired.add(b.id+'end');if(sess()?.blockId===b.id)continue;if(S.alarm.onEnd)chime();notify(b.kind==='rest'?'Fin del descanso':`Fin del bloque: ${b.title}`,b.kind==='rest'?'Hora de volver.':'Márcalo como terminado.')}
  }
  for(const t of day.tasks||[]){if(t.done||!t.time)continue;const at=atMin(k,t2m(t.time));
    if(n>=at-15*60e3&&n<at-14*60e3&&!fired.has(t.id+'t15')){fired.add(t.id+'t15');notify(`Tarea pendiente: ${t.title}`,`Te quedan 15 min (antes de las ${t.time}).`)}
    if(n>=at&&n<at+60e3&&!fired.has(t.id+'t0')){fired.add(t.id+'t0');chime();notify(`⏰ Se acabó el plazo: ${t.title}`,'Márcala como hecha o muévela a mañana.')}}
  const s=sess();if(s&&!s.pauseAt&&!s.restAt){const m=Math.floor(sFocused(s,n)/60);if(m>=90&&!s.notified[90]){s.notified[90]=1;save();notify('Llevas 90 minutos concentrado','Sigue así.')}}
}

function inboxToDay(id,k,blockId){
  const i=S.inbox.findIndex(x=>x.id===id);if(i<0)return;const it=S.inbox[i];
  const d=ensureDay(k);d.tasks=d.tasks||[];d.tasks.push({id:uid(),tplId:null,title:it.title,time:'',done:false,doneAt:null,blockId:blockId||null});sortTasks(d);
  S.inbox.splice(i,1);save();toast(blockId?'Tarea asignada al bloque':`Tarea para ${dayLabel(k)}`);
}
function pickBlockSheet(inboxId){
  const today=dayKey(Date.now()),n=Date.now();
  const opts=[today,addDays(today,1)].flatMap(k=>ensureDay(k).blocks.filter(b=>b.kind!=='rest'&&b.status!=='completed'&&b.end>n).map(b=>[k,b]));
  return `<span class="over acc">¿En qué bloque la haces?</span>${opts.length?opts.map(([k,b])=>`<button class="blk" data-act="ib-toblock" data-id="${inboxId}" data-k="${k}" data-b="${b.id}"><span class="stripe" style="background:#${b.color}"></span><span style="flex:1;min-width:0"><div class="t">${esc(b.title)}</div><div class="s">${dayLabel(k)} · ${hhmm(b.start)}–${hhmm(b.end)}</div></span></button>`).join(''):'<p class="muted">No hay bloques pendientes hoy ni mañana.</p>'}`;
}
const blockTasks=(k,blockId)=>dayTasks(k).filter(t=>t.blockId===blockId);
function blockTasksList(k,blockId){
  const list=blockTasks(k,blockId);if(!list.length)return '';
  return `<div class="stack" style="gap:2px;border-top:1px solid var(--stroke);padding-top:10px"><span class="over">Tareas de este bloque · ${list.filter(t=>t.done).length}/${list.length}</span>${list.map(t=>taskItem(t,k)).join('')}</div>`;
}

/* ═════════════════════ 6  REVISIÓN SEMANAL ═════════════════════ */
function mondayOf(k){const d=keyToDate(k);return addDays(k,-((d.getDay()+6)%7))}
function weekOf(k){return mondayOf(k)}
function reviewWeekStart(){const today=dayKey(Date.now()),wd=new Date().getDay();return wd===0&&new Date().getHours()>=12?mondayOf(today):addDays(mondayOf(today),-7)}
function weekFocusLine(){const f=S.weekly[mondayOf(dayKey(Date.now()))+'-focus'];return f?`<div class="row" style="gap:8px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px"><span>🎯</span><span><b>Foco de la semana:</b> ${esc(f)}</span></div>`:''}
function weeklyData(mon){
  const keys=Array.from({length:7},(_,i)=>addDays(mon,i)),prevKeys=keys.map(k=>addDays(k,-7));
  const sc=keys.map(k=>[k,score(k)]),pv=prevKeys.map(k=>score(k));
  const eff=sc.reduce((a,[,r])=>a+r.eff,0),pEff=pv.reduce((a,r)=>a+r.eff,0);
  const scored=sc.filter(([,r])=>r.sc!=null),avg=scored.length?scored.reduce((a,[,r])=>a+r.sc,0)/scored.length:null;
  const pScored=pv.filter(r=>r.sc!=null),pAvg=pScored.length?pScored.reduce((a,r)=>a+r.sc,0)/pScored.length:null;
  const tk=taskPct(keys.map(taskDay)),pTk=taskPct(prevKeys.map(taskDay));
  const best=scored.slice().sort((a,b)=>b[1].sc-a[1].sc)[0],worst=scored.slice().sort((a,b)=>a[1].sc-b[1].sc)[0];
  const dis=sc.reduce((a,[,r])=>a+r.dis,0);
  // franjas horarias
  const fr={Mañana:{n:0,ok:0,delay:0,d:0},Mediodía:{n:0,ok:0,delay:0,d:0},Tarde:{n:0,ok:0,delay:0,d:0}};
  for(const k of keys)for(const b of (S.days[k]||{blocks:[]}).blocks){if(b.kind==='rest')continue;if(b.status!=='completed'&&b.status!=='missed'&&b.end>Date.now())continue;
    const h=new Date(b.start).getHours(),f=h<12?'Mañana':h<16?'Mediodía':'Tarde';fr[f].n++;if(b.status==='completed')fr[f].ok++;
    if(b.actualStart){fr[f].delay+=Math.max(0,(b.actualStart-b.start)/60e3);fr[f].d++}}
  const franjas=Object.entries(fr).filter(([,v])=>v.n).map(([name,v])=>({name,n:v.n,rate:v.ok/v.n,delay:v.d?v.delay/v.d:0}));
  const worstF=franjas.filter(f=>f.n>=2).sort((a,b)=>a.rate-b.rate)[0];
  // hábitos de la semana
  const map={};for(const k of keys)for(const t of dayTasks(k)){if(!taskDue(t,k)||!t.tplId)continue;const m=map[t.tplId]=map[t.tplId]||{title:((S.taskTpl||[]).find(x=>x.id===t.tplId)||t).title,due:0,done:0};m.due++;if(t.done)m.done++}
  const habits=Object.values(map).sort((a,b)=>a.done/a.due-b.done/b.due);
  const delays=keys.flatMap(k=>(S.days[k]||{blocks:[]}).blocks.filter(b=>b.actualStart).map(b=>Math.max(0,(b.actualStart-b.start)/60e3)));
  const avgDelay=delays.length?delays.reduce((a,b)=>a+b,0)/delays.length:0;
  const hasData=sc.some(([,r])=>r.hasData);
  // recomendaciones
  const rec=[];const goal=S.goals.weekHours*3600;
  if(hasData){
    if(eff<goal*0.8)rec.push(`Has hecho ${hrs(eff)} de ${S.goals.weekHours} h. Reserva desde el lunes ${Math.ceil((goal-eff)/3600/5)} h extra al día de trabajo profundo o ajusta el objetivo a algo realista.`);
    if(worstF&&worstF.rate<0.7)rec.push(`Tu peor franja es la ${worstF.name.toLowerCase()} (${Math.round(worstF.rate*100)}% de bloques completados). Pon ahí tareas ligeras y mueve lo importante a tu mejor franja.`);
    if(habits[0]&&habits[0].done/habits[0].due<0.6)rec.push(`«${habits[0].title}» solo ${habits[0].done}/${habits[0].due}. Ponle hora límite para que te avise, o hazla justo después de algo que ya haces cada día.`);
    if(avgDelay>5)rec.push(`Empiezas los bloques con ${Math.round(avgDelay)} min de retraso medio. Deja preparado el primer bloque la noche anterior y activa los avisos push.`);
    if(dis>S.goals.maxDistraction*60*5)rec.push(`${dur(dis)} de distracciones en la semana. Deja el móvil fuera de la mesa en los bloques profundos.`);
    if(tk.pct!=null&&tk.pct>=0.85&&(avg==null||avg>=S.goals.target/100))rec.push('Semana sólida. Mantén lo que te ha funcionado y sube un poco el objetivo de horas.');
    if(!rec.length)rec.push('Buen equilibrio. Elige una sola cosa que mejorar y apúntala como foco de la semana.');
  }
  return {keys,sc,eff,pEff,avg,pAvg,tk,pTk,best,worst,dis,franjas,habits,avgDelay,rec:rec.slice(0,3),hasData};
}
function weeklySheet(mon){
  const w=weeklyData(mon),end=addDays(mon,6),next=addDays(mon,7),delta=(a,b,u,f=1)=>b>0?`${a-b>=0?'+':'−'}${Math.abs((a-b)*f).toLocaleString('es-ES',{maximumFractionDigits:1})}${u} vs anterior`:'';
  const nm=k=>keyToDate(k).toLocaleDateString('es-ES',{weekday:'long'});
  return `<span class="over acc">📊 Revisión semanal</span><b style="font-size:20px">${keyToDate(mon).toLocaleDateString('es-ES',{day:'numeric',month:'short'})} – ${keyToDate(end).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</b>
  ${!w.hasData?'<p class="muted">No hay registros esta semana. Planifica bloques y tareas y la próxima revisión tendrá datos reales.</p>':`
  <div class="grid2"><div class="tile"><span class="over">Horas efectivas</span><div class="v">${hrs(w.eff)}</div><div class="f">objetivo ${S.goals.weekHours} h · ${delta(w.eff/3600,w.pEff/3600,' h')}</div></div>
  <div class="tile"><span class="over">Efectividad media</span><div class="v">${pct(w.avg)}</div><div class="f">${w.avg!=null&&w.pAvg!=null?delta(w.avg,w.pAvg,' pts',100):''}</div></div>
  <div class="tile"><span class="over">Tareas cumplidas</span><div class="v" style="color:${pctColor(w.tk.pct)}">${w.tk.pct==null?'—':Math.round(w.tk.pct*100)+'%'}</div><div class="f">${w.tk.done}/${w.tk.due}${w.tk.pct!=null&&w.pTk.pct!=null?' · '+delta(w.tk.pct,w.pTk.pct,' pts',100):''}</div></div>
  <div class="tile"><span class="over">Distracciones</span><div class="v">${dur(w.dis)}</div><div class="f">retraso medio ${Math.round(w.avgDelay)} min</div></div></div>
  ${w.best?`<p class="muted">🏆 Mejor día: <b>${nm(w.best[0])}</b> (${pct(w.best[1].sc)})${w.worst&&w.worst[0]!==w.best[0]?` · Peor: <b>${nm(w.worst[0])}</b> (${pct(w.worst[1].sc)})`:''}</p>`:''}
  ${w.franjas.length?`<div class="stack" style="gap:6px"><span class="over">Por franja horaria</span>${w.franjas.map(f=>`<div class="stack" style="gap:4px"><div class="between" style="font-size:13.5px"><span>${f.name}</span><span style="color:${pctColor(f.rate)};font-weight:700">${Math.round(f.rate*100)}% · ${f.n} bloques${f.delay>1?` · +${Math.round(f.delay)} min`:''}</span></div><div class="bar" style="height:5px"><b style="width:${f.rate*100}%;background:${pctColor(f.rate)}"></b></div></div>`).join('')}</div>`:''}
  ${w.habits.length?`<div class="stack" style="gap:6px"><span class="over">Hábitos</span>${w.habits.map(h=>`<div class="between" style="font-size:13.5px"><span>↻ ${esc(h.title)}</span><span style="color:${pctColor(h.done/h.due)};font-weight:700">${h.done}/${h.due}</span></div>`).join('')}</div>`:''}
  <div class="stack" style="gap:8px"><span class="over">Para la próxima semana</span>${w.rec.map(r=>`<p class="muted">• ${esc(r)}</p>`).join('')}</div>`}
  <label class="f" for="wk-focus">🎯 Tu foco para la semana que empieza<input id="wk-focus" value="${esc(S.weekly[next+'-focus']||'')}" placeholder="p. ej. 4 bloques profundos antes de las 11:00"></label>
  <button class="btn" data-act="wk-save" data-k="${mon}">Guardar revisión</button><button style="color:var(--fg3);font-size:14px" data-act="wk-skip" data-k="${mon}">Ahora no</button>`;
}

/* Decide qué ritual mostrar al abrir la app. */
function maybeRituals(){
  if(overlay||deep||S.rituals===false)return;
  const now=new Date(),h=now.getHours(),k=dayKey(now),p=plan(k);
  const mon=reviewWeekStart(),wk=S.weekly[mon]||{};
  const wd=now.getDay();
  if(!wk.done&&!wk.skipped&&((wd===0&&h>=18)||wd===1)&&weeklyData(mon).hasData){overlay={type:'weekly',k:mon};return}
  if(!p.planned&&!p.skipped&&h>=4&&h<20&&!sess()){overlay={type:'morning'};return}
  const day=S.days[k],lastEnd=day&&day.blocks.length?Math.max(...day.blocks.map(b=>b.end)):null;
  if(!p.closed&&!p.eveSkipped&&(h>=21||(lastEnd&&Date.now()>lastEnd&&h>=17))&&(day&&(day.blocks.length||(day.tasks||[]).length))&&!sess()){overlay={type:'review',evening:true}}
}

function boot(){
  ensureDay(dayKey(Date.now()));ensureDay(addDays(dayKey(Date.now()),1));syncTasks(dayKey(Date.now()));syncTasks(addDays(dayKey(Date.now()),1));markMissed();
  const s=sess();if(s&&!overlay&&Date.now()>s.plannedEnd+30*60e3)overlay={type:'recover'};
  maybeRituals();
  save(false);render();
  if(S.cloudOn)loadSB().then(()=>{if(sbUser)return cloudPull().then(()=>{if(!overlay||tab==='settings')render()})}).catch(e=>{cloud={status:'error',msg:cloudErr(e),last:cloud.last}});
}
S.alarm=Object.assign({enabled:true,onEnd:true,onStart:true,sound:'pulse',volume:90},S.alarm||{});
if(!S.onboarded){S.onboarded=true;if(!S.template){S.template=DEFAULT_TEMPLATE}}
boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
